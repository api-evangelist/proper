name: Proper
description: 'Proper (proper.ai) is an AI-powered, full-service property-management
  accounting and bookkeeping provider serving property managers, asset managers, and
  real estate developers. Rather than shipping software, Proper delivers a trained
  accounting team supported by automation to handle accounts payable, accounts receivable,
  bank reconciliations, month-end close, and financial reporting, integrating with
  existing property-management systems such as AppFolio, Buildium, and RentManager.
  Founded in the property-management space in 2017, the company is backed by QED Investors,
  Redpoint Ventures, MetaProp, Expa, and Bling Capital. As of this enrichment pass
  Proper exposes no public API, developer portal, SDK, or machine-readable developer
  surface; this profile is maintained as a company record.'
